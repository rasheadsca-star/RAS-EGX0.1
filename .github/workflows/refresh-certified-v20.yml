name: Refresh Certified EGX PRO V20 (Retired)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-certified-egx-pro-v20-retired
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Static V20 publisher retired
        shell: bash
        run: |
          set -euo pipefail
          echo "This legacy static-mirror publisher is retired."
          echo "V20 Executive Engine is the sole automated publisher of V20 runtime data."
          echo "No repository files are changed by this workflow."

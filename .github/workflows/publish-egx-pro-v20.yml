name: Publish EGX PRO V20

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-egx-pro-v20.yml"

permissions:
  contents: write

concurrency:
  group: publish-egx-pro-v20
  cancel-in-progress: true

jobs:
  publish-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Fetch certified V20 source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v20-source .v17-runtime
          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            --branch develop/v20-integrated-decision-platform \
            https://github.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT.git \
            .v20-source
          cd .v20-source
          git sparse-checkout init --cone
          git sparse-checkout set v20 data/v20
          git checkout
          git rev-parse HEAD > ../.v20-source-sha
          cd ..

      - name: Verify canonical V17-centric release certification
        shell: bash
        run: |
          set -euo pipefail
          cd .v20-source
          node - <<'NODE'
          const fs=require('fs');
          const contract=require('./data/v20/final-decision-contract.json');
          const core=require('./data/v20/v17-production-decision-core.json');
          const native=require('./data/v20/native-current.json');
          const browser=require('./data/v20/decision-board-browser-certification.json');
          const cert=require('./data/v20/v17-centric-final-certification.json');
          const semantic=require('./data/v20/v17-centric-semantic-acceptance.json');
          const navReg=require('./data/v20/funded-nav-regression.json');
          const forwardReg=require('./data/v20/signal-archive/native-shadow/regression.json');
          const perfReg=require('./data/v20/performance-evidence-regression.json');
          const govReg=require('./data/v20/champion-challenger-regression.json');
          const registry=require('./data/v20/champion-challenger-registry.json');
          const sync=require('./data/v20/v17-runtime-sync.json');

          const assert=(ok,msg)=>{if(!ok)throw new Error(msg);};
          assert(cert.schemaVersion==='20.0.0-v17-centric-final-certification-1','Unexpected final certification schema');
          assert(cert.ok===true&&cert.critical===0&&cert.major===0,'Final certification is not clean');
          assert(cert.architecture?.canonicalDecisionBoard===true&&cert.architecture?.v17Centric===true,'Canonical V17-centric architecture not certified');
          assert(cert.architecture?.nativeDiscoveryOnly===true&&cert.architecture?.v17ExecutionAuthorityPreserved===true,'Decision authority certification drift');
          assert(Number(cert.architecture?.legacyNativeScoringContributionPct)===0,'Legacy Native scoring contribution is not zero');
          assert(cert.product?.productStatus==='PRODUCTION_READY_DECISION_SUPPORT'&&cert.product?.decisionSupportCertified===true,'Decision-support product is not certified');
          assert(cert.governance?.activeChampion==='V16_9_EQUAL_WEIGHT_BASKET','Champion drift');
          assert(cert.governance?.automaticPromotion===false&&cert.governance?.automaticBrokerExecution===false&&cert.governance?.v20MayOverrideV17===false,'Governance drift');

          assert(contract.schemaVersion==='20.0.0-canonical-stock-decision-contract-1','Unexpected canonical contract schema');
          assert(contract.architecture==='V17_CENTRIC_V20_NATIVE_DISCOVERY','Canonical architecture drift');
          assert(contract.productStatus==='PRODUCTION_READY_DECISION_SUPPORT','Canonical product status is not certified');
          assert(contract.productReadiness?.certificationState==='CERTIFIED'&&contract.productReadiness?.productionReadyDecisionSupportMayBeClaimed===true,'Canonical certification state missing');
          assert(contract.policy?.v20Discovers===true&&contract.policy?.v17ValidatesAndAuthorizes===true&&contract.policy?.v20NativeCannotOverrideV17===true,'Canonical authority policy drift');
          assert(Number(contract.policy?.legacyNativeScoringContributionPct)===0,'Canonical Legacy contribution drift');
          assert(contract.sourceV17Commit===cert.source?.v17Commit,'Canonical/V17 certification SHA mismatch');
          assert(contract.sessionDate===cert.source?.sessionDate,'Canonical/certification session mismatch');
          assert(Array.isArray(contract.rows)&&contract.rows.length===Number(contract.summary?.evaluatedCount),'Canonical row count mismatch');
          assert((contract.rows||[]).every(r=>r.governance?.automaticPromotion===false&&r.governance?.automaticBrokerExecution===false&&r.governance?.v20MayOverrideV17===false),'Per-stock governance drift');

          assert(core.policy?.v17IsAuthoritativeForProductionEligibility===true&&core.policy?.v20NativeMayOverrideV17===false,'V17 production authority drift');
          assert(core.sourceV17?.commitSha===cert.source?.v17Commit,'V17 core provenance mismatch');
          assert(core.sessionDate===contract.sessionDate,'V17 core session mismatch');

          assert(native.engineId==='V20_FULL_MARKET_NATIVE_SELECTION_V1'&&native.modelVersion==='V1','Native V1 evidence missing');
          assert(native.candidateUniverseIsFullMarketIndependent===true&&native.legacySeedDependency===false,'Native candidate universe independence drift');
          assert(native.executionPermission===false&&native.productionAllocation===false&&native.automaticPromotion===false,'Native gained production authority');
          assert(Number(native.legacyScoringContributionPct)===0,'Native Legacy scoring contribution drift');
          assert(Array.isArray(native.publishedCandidates)&&native.publishedCandidates.length===30&&Number(native.summary?.publishedResearchCandidateCount)===30,'Native Top 30 not persisted');
          assert(native.publishedCandidates.every(r=>r.researchOnly===true&&r.grantsExecutionPermission===false&&r.grantsProductionAllocation===false),'Native candidate governance drift');

          assert(browser.schemaVersion==='20.0.0-v17-centric-browser-certification-1','Unexpected Decision Board browser schema');
          assert(browser.ok===true&&browser.failedCount===0&&(browser.failures||[]).length===0,'Decision Board browser certification is not green');
          assert(browser.architecture===contract.architecture&&browser.sessionDate===contract.sessionDate,'Browser/canonical provenance mismatch');
          assert((browser.consoleErrors||[]).length===0&&browser.checks?.noRuntimeOrConsoleErrors?.ok===true,'Browser runtime or console errors present');
          const expectedWidths=[1440,1024,768,430,390];
          assert(JSON.stringify((browser.viewportResults||[]).map(v=>v.width))===JSON.stringify(expectedWidths),'Certified responsive viewport set mismatch');
          assert((browser.viewportResults||[]).every(v=>v.ready===true&&v.horizontalOverflow===false&&(v.width>430||v.dialogHorizontalOverflow===false)),'Certified responsive layout failure');
          for(const key of ['decisionBoardLoaded','decisionBoardNoLoadError','decisionBoardIsPrimary','decisionPipelineFourStages','nativeDiscoveryStageVisible','v17EligibilityStageVisible','v17GlobalGateStageVisible','finalCanonicalDecisionStageVisible','legacyWorkspaceSecondary','nativeScoreSeparationVisible','evidenceStripLoaded','allCanonicalRowsRendered','stockDossierOpened','stockDossierLabelVisible','nativeScoreNotConfidenceVisible','technicalSourceVsProductionVisible','srSourceVsProductionVisible','corporateActionSafetyVisible','globalGateVisibleInDossier','provenanceVisible','legacyContributionZeroVisible','nativeExecutionPermissionDeniedVisible','dossierNoHorizontalOverflow1440']) assert(browser.checks?.[key]?.ok===true,`Decision Board browser check missing: ${key}`);

          for(const [name,x] of Object.entries({semantic,navReg,forwardReg,perfReg,govReg})) assert(x.ok===true,`${name} regression not green`);
          assert(registry.activeChampion==='V16_9_EQUAL_WEIGHT_BASKET'&&registry.automaticPromotion===false,'Champion/challenger registry drift');
          assert(sync.ok===true&&sync.source?.branch==='develop/v17-rebuild'&&sync.source?.commitSha===cert.source?.v17Commit,'V17 runtime sync provenance drift');

          if(contract.sessionStatus!=='EXECUTION_GRADE'){
            assert(contract.sessionStatus==='RESEARCH_ONLY','Unexpected closed-gate session status');
            assert(Number(contract.summary?.productionActionableCount)===0&&Number(contract.summary?.productionNewExposurePct)===0,'Closed gate must remain zero ACTIONABLE / zero new exposure');
            assert(!(contract.rows||[]).some(r=>r.governance?.finalDecisionState==='ACTIONABLE'),'Closed gate contains ACTIONABLE row');
            assert(browser.checks?.closedGateUiNoActionable?.ok===true,'Closed-gate UI exposes ACTIONABLE');
          }

          for(const file of [
            'v20/index.html','v20/app.js','v20/styles.css','v20/native-research.js','v20/decision-board.js','v20/decision-board.css',
            'data/v20/final-decision-contract.json','data/v20/v17-production-decision-core.json','data/v20/native-current.json','data/v20/native-model-freeze.json',
            'data/v20/v17-runtime-sync.json','data/v20/v17-centric-semantic-acceptance.json','data/v20/funded-nav.json','data/v20/funded-nav-regression.json',
            'data/v20/performance-evidence-registry.json','data/v20/performance-evidence-regression.json','data/v20/champion-challenger-registry.json','data/v20/champion-challenger-regression.json',
            'data/v20/decision-board-browser-certification.json','data/v20/v17-centric-final-certification.json'
          ]) assert(fs.existsSync(file),`Certified release package missing ${file}`);

          console.log(JSON.stringify({
            ok:true,
            architecture:contract.architecture,
            productStatus:contract.productStatus,
            sessionStatus:contract.sessionStatus,
            sessionDate:contract.sessionDate,
            evaluated:contract.summary?.evaluatedCount,
            nativePublished:native.publishedCandidates.length,
            v17RecommendationEligible:core.summary?.recommendationEligibleCount,
            v17ExecutionEligible:core.summary?.executionEligibleCount,
            actionable:contract.summary?.productionActionableCount,
            newExposurePct:contract.summary?.productionNewExposurePct,
            activeChampion:registry.activeChampion,
            browserFailed:browser.failedCount,
            certifiedWidths:expectedWidths,
            v17Commit:cert.source?.v17Commit
          },null,2));
          NODE

      - name: Materialize exact certified V17 runtime package
        shell: bash
        run: |
          set -euo pipefail
          V17_SHA="$(node -e "console.log(require('./.v20-source/data/v20/v17-centric-final-certification.json').source.v17Commit)")"
          git -C .v20-source fetch --no-tags --depth=1 origin "$V17_SHA"
          rm -rf .v17-runtime
          mkdir -p .v17-runtime
          git -C .v20-source archive "$V17_SHA" data/v17 | tar -x -C .v17-runtime
          test -f .v17-runtime/data/v17/resilient-session-status.json
          test -f .v17-runtime/data/v17/internal-ohlc-support-resistance.json
          test -f .v17-runtime/data/v17/liquidity-gate.json
          node -e "JSON.parse(require('fs').readFileSync('.v17-runtime/data/v17/resilient-session-status.json','utf8'))"
          echo "$V17_SHA" > .v17-source-sha

      - name: Publish canonical V20 under isolated /v20 path
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(cat .v20-source-sha)"
          V17_SHA="$(cat .v17-source-sha)"
          rm -rf v20 data/v20 data/v17
          mkdir -p data
          cp -R .v20-source/v20 ./v20
          cp -R .v20-source/data/v20 ./data/v20
          cp -R .v17-runtime/data/v17 ./data/v17
          node - <<'NODE'
          const fs=require('fs');
          const sourceSha=fs.readFileSync('.v20-source-sha','utf8').trim();
          const v17Sha=fs.readFileSync('.v17-source-sha','utf8').trim();
          const contract=require('./data/v20/final-decision-contract.json');
          const cert=require('./data/v20/v17-centric-final-certification.json');
          const native=require('./data/v20/native-current.json');
          const browser=require('./data/v20/decision-board-browser-certification.json');
          const registry=require('./data/v20/champion-challenger-registry.json');
          const deployment={
            release:'EGX PRO V20',
            sourceRepository:'rasheadsca-star/RAS-EGX-PRO2026-NEXT',
            sourceBranch:'develop/v20-integrated-decision-platform',
            sourceCommit:sourceSha,
            certificationWorkflowCommit:cert.source.workflowCommit,
            certifiedV17Commit:v17Sha,
            deploymentRepository:'rasheadsca-star/RAS-EGX0.1',
            deploymentPath:'/v20/',
            architecture:contract.architecture,
            primaryDecisionUi:'DECISION_BOARD_V17_CENTRIC',
            decisionSupportCertified:true,
            productStatus:contract.productStatus,
            sessionDate:contract.sessionDate,
            sessionStatus:contract.sessionStatus,
            releaseMode:contract.sessionStatus==='EXECUTION_GRADE'?'DECISION_SUPPORT_EXECUTION_GRADE':'RESEARCH_ONLY_EXECUTION_BLOCKED',
            productionActionableCount:Number(contract.summary.productionActionableCount||0),
            productionNewExposurePct:Number(contract.summary.productionNewExposurePct||0),
            activeChampion:registry.activeChampion,
            automaticPromotion:false,
            automaticBrokerExecution:false,
            nativeDiscoveryOnly:true,
            nativeEngine:native.engineId,
            nativeModelVersion:native.modelVersion,
            nativePublishedCandidateCount:native.publishedCandidates.length,
            nativeExecutionPermission:false,
            nativeProductionAllocation:false,
            legacyNativeScoringContributionPct:0,
            browserE2ECertified:browser.ok===true&&browser.failedCount===0,
            certifiedResponsiveWidths:(browser.viewportResults||[]).map(v=>v.width),
            publishedAt:new Date().toISOString()
          };
          fs.writeFileSync('v20/deployment.json',`${JSON.stringify(deployment,null,2)}\n`,'utf8');
          NODE

      - name: Validate deployable canonical static paths
        shell: bash
        run: |
          set -euo pipefail
          test -f v20/index.html
          test -f v20/app.js
          test -f v20/styles.css
          test -f v20/native-research.js
          test -f v20/decision-board.js
          test -f v20/decision-board.css
          test -f v20/deployment.json
          test -f data/v20/final-decision-contract.json
          test -f data/v20/v17-production-decision-core.json
          test -f data/v20/native-current.json
          test -f data/v20/decision-board-browser-certification.json
          test -f data/v20/v17-centric-final-certification.json
          test -f data/v17/resilient-session-status.json
          test -f data/v17/internal-ohlc-support-resistance.json
          node --check v20/app.js
          node --check v20/native-research.js
          node --check v20/decision-board.js
          node - <<'NODE'
          const d=require('./v20/deployment.json');
          const c=require('./data/v20/final-decision-contract.json');
          const cert=require('./data/v20/v17-centric-final-certification.json');
          const b=require('./data/v20/decision-board-browser-certification.json');
          const core=require('./data/v20/v17-production-decision-core.json');
          if(d.architecture!=='V17_CENTRIC_V20_NATIVE_DISCOVERY'||d.primaryDecisionUi!=='DECISION_BOARD_V17_CENTRIC')throw Error('Deployment architecture drift');
          if(d.decisionSupportCertified!==true||d.productStatus!=='PRODUCTION_READY_DECISION_SUPPORT')throw Error('Deployment certification missing');
          if(d.certifiedV17Commit!==cert.source.v17Commit||d.certifiedV17Commit!==c.sourceV17Commit||d.certifiedV17Commit!==core.sourceV17.commitSha)throw Error('Deployment V17 SHA mismatch');
          if(d.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET'||d.automaticPromotion!==false||d.automaticBrokerExecution!==false)throw Error('Deployment governance drift');
          if(d.nativeDiscoveryOnly!==true||d.nativeExecutionPermission!==false||d.nativeProductionAllocation!==false||Number(d.legacyNativeScoringContributionPct)!==0)throw Error('Deployment Native authority drift');
          if(d.browserE2ECertified!==true||b.ok!==true||b.failedCount!==0)throw Error('Deployment browser certification missing');
          if(JSON.stringify(d.certifiedResponsiveWidths)!==JSON.stringify([1440,1024,768,430,390]))throw Error('Deployment responsive certification drift');
          if(c.sessionStatus!=='EXECUTION_GRADE'&&(Number(d.productionActionableCount)!==0||Number(d.productionNewExposurePct)!==0||d.releaseMode!=='RESEARCH_ONLY_EXECUTION_BLOCKED'))throw Error('Closed-gate deployment leak');
          console.log(JSON.stringify({ok:true,sourceCommit:d.sourceCommit,v17Commit:d.certifiedV17Commit,architecture:d.architecture,productStatus:d.productStatus,sessionStatus:d.sessionStatus,actionable:d.productionActionableCount,newExposurePct:d.productionNewExposurePct,champion:d.activeChampion,browserE2E:d.browserE2ECertified,widths:d.certifiedResponsiveWidths},null,2));
          NODE

      - name: Commit isolated certified V20 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20 data/v20 data/v17
          if git diff --cached --quiet; then
            echo "Certified V20 deployment tree already current"
            exit 0
          fi
          SOURCE_SHA="$(cat .v20-source-sha)"
          git commit -m "Publish certified V17-centric EGX PRO V20 ${SOURCE_SHA:0:12}"
          git push origin HEAD:main

      - name: Publication summary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const d=require('./v20/deployment.json');
          console.log('### EGX PRO V20 — certified V17-centric release');
          console.log('URL: https://rasheadsca-star.github.io/RAS-EGX0.1/v20/');
          console.log(`Architecture: ${d.architecture}`);
          console.log(`Product: ${d.productStatus}`);
          console.log(`Session: ${d.sessionStatus}`);
          console.log(`Decision Board E2E: ${d.browserE2ECertified?'PASS':'FAIL'} (${d.certifiedResponsiveWidths.join(' / ')})`);
          console.log(`Native: discovery only / ${d.nativePublishedCandidateCount} published / Legacy scoring 0% / no execution authority`);
          console.log(`Production: ${d.productionActionableCount} ACTIONABLE / ${d.productionNewExposurePct}% new exposure`);
          console.log(`Champion: ${d.activeChampion} / automatic promotion disabled`);
          console.log(`Certified V17 SHA: ${d.certifiedV17Commit}`);
          NODE

name: V20 Executive Engine

on:
  workflow_dispatch:
  schedule:
    # 17:20 Africa/Cairo (UTC+3), Sunday-Thursday, after EGX close.
    - cron: '20 14 * * 0-4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v20-executive-engine.yml'

permissions:
  contents: write

concurrency:
  group: v20-executive-engine
  cancel-in-progress: true

jobs:
  rebuild-v20-executive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      V20_SOURCE_BRANCH: develop/v20-integrated-decision-platform
      V17_SOURCE_BRANCH: develop/v17-rebuild
      V20_REGIME_NETWORK_REFRESH: 'true'
      V20_REGIME_CONCURRENCY: '6'
      V20_REGIME_MIN_PARTICIPATION_PCT: '60'
      V20_REGIME_PRICE_TOLERANCE_PCT: '5'
      V20_REGIME_MIN_TRUSTED_SESSIONS: '50'
      V20_REGIME_FETCH_RANGE: '6mo'
      V20_HISTORY_NETWORK_REFRESH: 'true'
      V20_HISTORY_CONCURRENCY: '4'
      V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT: '5'
      V20_NATIVE_FULL_TECH_NETWORK_REFRESH: 'true'
      V20_NATIVE_FULL_TECH_CONCURRENCY: '8'
      V20_NATIVE_FULL_TECH_PRICE_TOLERANCE_PCT: '5'

    steps:
      - name: Checkout deployment repository only
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Protect MAIN APP
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          test -z "$(git status --porcelain)"
          echo "MAIN_APP_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Only data/v20/** and v20/deployment.json may be published."

      - name: Prepare authoritative V17 and isolated V20 workspaces
        shell: bash
        run: |
          set -euo pipefail
          V17_DIR="$RUNNER_TEMP/v17-authoritative-runtime"
          V20_DIR="$RUNNER_TEMP/v20-executive-runtime"
          rm -rf "$V17_DIR" "$V20_DIR"

          git clone --quiet --depth=1 --branch "$V17_SOURCE_BRANCH" \
            https://github.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT.git "$V17_DIR"
          cd "$V17_DIR"

          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const current=read('data/v17/current.json');
          const gate=read('data/v17/resilient-session-status.json');
          const truth=read('data/v17/market-session-truth.json');
          const liquidity=read('data/v17/liquidity-gate.json');
          const challenger=read('data/v17/challenger-status.json');
          const rec=read('data/recommendations.json');
          const technical=read('data/technical-50-report.json');
          const review=read('data/v17/review.json');
          const regression=read('data/v17/regression.json');
          const session=truth.selectedSessionDate || current.sessionDate;
          if(!/^\d{4}-\d{2}-\d{2}$/.test(String(session||''))) throw new Error('No authoritative V17 session');
          if(current.sessionDate!==session) throw new Error('V17 current/session mismatch');
          if(rec.sessionDate!==session||rec.engine!=='V17_CURRENT_SESSION_TECHNICAL_BASE_1') throw new Error('V17 recommendation base is not canonical');
          if(technical.referenceSessionDate!==session||technical.version!=='5.6.1-v17-session-truth') throw new Error('V17 Technical-50 is not canonical');
          if(challenger.activeEngine!=='V16_9_EQUAL_WEIGHT_BASKET'||challenger.promotionAllowed!==false) throw new Error('Champion governance drift');
          if(review.verdict!=='NO_COMMENTS'||Object.values(review.counts||{}).some(v=>Number(v||0)!==0)) throw new Error('V17 review is not clean');
          if(regression.ok!==true||Number(regression.failedCount||0)!==0||Number(regression.criticalFailedCount||0)!==0) throw new Error('V17 regression is not green');
          if(!['HEALTHY','DEGRADED','RESEARCH_ONLY'].includes(gate.status)) throw new Error(`Unacceptable V17 gate: ${gate.status}`);
          if(gate.executionGrade===true){
            if(gate.sessionAligned!==true) throw new Error('Execution grade without aligned session');
            if((gate.priceTruth?.verifiedSessionDate||gate.sessionDate)!==session) throw new Error('Execution-grade price truth mismatch');
            if(liquidity.gatePassed!==true||truth.executionSafe!==true) throw new Error('Execution grade without liquidity/session truth');
          } else {
            if(Number(current.portfolioPolicy?.plannedAllocationPct||0)!==0||Number(current.portfolioPolicy?.cashReservePct||0)!==100) throw new Error('Closed V17 gate carries exposure');
            if((current.recommendations||[]).some(r=>r.executionAllowed===true)) throw new Error('Closed V17 gate carries executable recommendation');
          }
          console.log(JSON.stringify({sessionDate:session,gateStatus:gate.status,executionGrade:gate.executionGrade===true,sessionAligned:gate.sessionAligned===true},null,2));
          NODE

          V17_SHA="$(git rev-parse HEAD)"
          git clone --quiet --depth=1 --branch "$V20_SOURCE_BRANCH" \
            https://github.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT.git "$V20_DIR"
          cd "$V20_DIR"

          mkdir -p data/v17
          cp -a "$V17_DIR/data/v17/." data/v17/
          find "$V17_DIR/data" -maxdepth 1 -type f -name '*.json' -exec cp -f {} data/ \;

          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const market=read('data/market.json');
          const current=read('data/v17/current.json');
          const truth=read('data/v17/market-session-truth.json');
          const gate=read('data/v17/resilient-session-status.json');
          const session=truth.selectedSessionDate || current.sessionDate;
          if(!/^\d{4}-\d{2}-\d{2}$/.test(String(session||''))) throw new Error('No research session to bind');
          market.sessionDate=session;
          market.sessionDateMode=gate.executionGrade===true ? 'V17_EXECUTION_VERIFIED_SESSION' : 'V17_RESEARCH_SESSION_REFERENCE';
          market.sessionDateExecutionVerified=gate.executionGrade===true && gate.sessionAligned===true;
          market.sessionDateProvenance='data/v17/market-session-truth.json + data/v17/current.json';
          write('data/market.json',market);
          console.log(JSON.stringify({boundMarketSession:market.sessionDate,executionVerified:market.sessionDateExecutionVerified===true},null,2));
          NODE

          echo "V17_RUNTIME_SHA=$V17_SHA" >> "$GITHUB_ENV"
          echo "V20_DIR=$V20_DIR" >> "$GITHUB_ENV"

      - name: V20 Data Truth and provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "$V20_DIR"
          export GITHUB_WORKSPACE="$V20_DIR"
          node scripts/v20/build-data-truth.cjs
          node scripts/v20/data-quality-regression.cjs
          node scripts/v20/build-sector-provenance-audit.cjs

      - name: V20 Market Regime
        shell: bash
        run: |
          set -euo pipefail
          cd "$V20_DIR"
          export GITHUB_WORKSPACE="$V20_DIR"
          node scripts/v20/build-market-regime.cjs
          node scripts/v20/market-regime-regression.cjs

      - name: V20 Base decision contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$V20_DIR"
          export GITHUB_WORKSPACE="$V20_DIR"
          # Establish common governance/session state only. Native selection replaces
          # the legacy opportunity source before risk and publication.
          node scripts/v20/build-integrated-decision-snapshot.cjs

      - name: V20 Full-market native discovery
        shell: bash
        run: |
          set -euo pipefail
          cd "$V20_DIR"
          export GITHUB_WORKSPACE="$V20_DIR"
          node scripts/v20/build-trusted-technical-history.cjs
          node scripts/v20/technical-history-regression.cjs
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs

          # Research and execution session semantics are intentionally separate.
          # Same-session market prices may feed Native research, but this overlay
          # can never open V17 execution, allocate production capital, or send orders.
          node scripts/v20/prepare-native-research-market.cjs
          node scripts/v20/market-explorer-regression.cjs

          # Full-market Native scan. No legacy seed contributes to the Native score.
          node scripts/v20/build-full-market-native-technical.cjs
          node scripts/v20/build-full-market-native-selection.cjs
          node scripts/v20/full-market-native-regression.cjs

      - name: V20 Native executive decision and risk
        shell: bash
        run: |
          set -euo pipefail
          cd "$V20_DIR"
          export GITHUB_WORKSPACE="$V20_DIR"
          node scripts/v20/build-native-executive-current.cjs
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs
          node scripts/v20/native-executive-current-regression.cjs

          # Rebuild explorer after Native replaces current.opportunities so the
          # published explorer reflects Native ranks/statuses rather than legacy ones.
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/prepare-native-research-market.cjs
          node scripts/v20/market-explorer-regression.cjs
          node scripts/v20/user-portfolio-regression.cjs

      - name: V20 Executive fail-closed guard
        shell: bash
        run: |
          set -euo pipefail
          cd "$V20_DIR"
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const x=read('data/v20/current.json');
          const gate=read('data/v17/resilient-session-status.json');
          const truth=read('data/v17/market-session-truth.json');
          const currentV17=read('data/v17/current.json');
          const risk=read('data/v20/portfolio-risk.json');
          const nativeReg=read('data/v20/native-executive-current-regression.json');
          const overlay=read('data/v20/native-research-session-overlay.json');
          const session=truth.selectedSessionDate || currentV17.sessionDate;

          if(x.sessionDate!==session) throw new Error(`V20/V17 session mismatch ${x.sessionDate} != ${session}`);
          if(x.governance?.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET') throw new Error('V20 champion reference drift');
          if(x.governance?.automaticPromotion!==false||x.governance?.promotionAllowed!==false) throw new Error('Automatic promotion is forbidden');
          if(x.portfolio?.automaticOrders!==false) throw new Error('Automatic broker orders are forbidden');
          if(x.selectionEngine?.engineId!=='V20_FULL_MARKET_NATIVE_SELECTION_V1') throw new Error('Native selection engine missing');
          if(x.selectionEngine?.mode!=='V20_NATIVE_FULL_MARKET_PRIMARY_SELECTION') throw new Error('Native selection is not primary');
          if(x.selectionEngine?.candidateUniverseIsFullMarketIndependent!==true||x.selectionEngine?.legacySeedDependency!==false) throw new Error('Native independence invariant failed');
          if(Number(x.selectionEngine?.legacyScoringContributionPct)!==0) throw new Error('Legacy score leaked into native selection');
          if(nativeReg.ok!==true||Number(nativeReg.failedCount||0)!==0) throw new Error('Native executive regression is not green');
          if((x.opportunities||[]).some(r=>r.provenance?.rankingSource!=='data/v20/full-market-native-selection.json')) throw new Error('Non-native opportunity source detected');
          if(overlay.ok!==true||overlay.sessionDate!==session||overlay.governance?.researchReferenceOnly!==true) throw new Error('Native research session overlay invalid');
          if(overlay.governance?.opensExecution!==false||overlay.governance?.productionAllocation!==false||overlay.governance?.automaticBrokerOrders!==false) throw new Error('Research overlay leaked into execution');

          const actionable=(x.opportunities||[]).filter(r=>r.status==='ACTIONABLE');
          if(gate.executionGrade!==true){
            if(x.executionStatus==='EXECUTION_GRADE') throw new Error('V20 claims execution while V17 gate is closed');
            if(Number(x.portfolio?.recommendedExposurePct||0)!==0||Number(x.portfolio?.cashPct||0)!==100) throw new Error('Closed gate must remain 100% cash');
            if(actionable.length) throw new Error('Closed gate produced actionable rows');
          } else {
            for(const row of actionable){
              if(row.liquidityExecutionEligible!==true) throw new Error(`${row.ticker}: liquidity gate missing`);
              if(row.supportResistance?.executionEligible!==true||row.supportResistance?.sessionAligned!==true) throw new Error(`${row.ticker}: S/R gate missing`);
              if(row.tradePlan?.alignment?.eligibleForActionable!==true||row.tradePlan?.alignment?.state!=='IN_ENTRY_RANGE') throw new Error(`${row.ticker}: entry alignment missing`);
              if(row.tradePlan?.target1Metrics?.valid!==true) throw new Error(`${row.ticker}: invalid risk/reward plan`);
            }
          }

          const max=Number(x.portfolio?.maximumTotalAllocationPct||0);
          const exposure=Number(x.portfolio?.recommendedExposurePct||0);
          if(exposure<0||exposure>max+1e-9) throw new Error('Portfolio exposure guard failed');

          x.operatingMode='EXECUTIVE_FAIL_CLOSED';
          x.executionPolicy={mode:'MANUAL_DECISION_EXECUTION',automaticBrokerOrders:false,v17GlobalGateAuthoritative:true,nativeFullMarketSelectionPrimary:true,researchSessionReferenceMayFeedNativeSelection:true,researchSessionReferenceMayOpenExecution:false,currentSessionRequired:true,liquidityRequired:true,supportResistanceRequired:true,tradePlanAlignmentRequired:true,positiveRiskRewardRequired:true,failedGateKeepsCash:true};
          write('data/v20/current.json',x);
          write('data/v20/executive-runtime.json',{
            schemaVersion:'20.0.0-executive-runtime-7',generatedAt:new Date().toISOString(),operatingMode:'EXECUTIVE_FAIL_CLOSED',
            sessionDate:x.sessionDate,status:x.status,executionStatus:x.executionStatus,actionableCount:actionable.length,
            recommendedExposurePct:exposure,cashPct:Number(x.portfolio?.cashPct||0),
            selectionEngine:x.selectionEngine,
            nativeResearchSessionReference:{enabled:true,coveragePct:overlay.researchReferenceCoveragePct,executionInfluence:false},
            source:{v17Branch:process.env.V17_SOURCE_BRANCH,v17Commit:process.env.V17_RUNTIME_SHA,v20Branch:process.env.V20_SOURCE_BRANCH,buildMode:'FULL_MARKET_NATIVE_SELECTION_WITH_RESEARCH_SESSION_REFERENCE_AND_READ_ONLY_V17_EXECUTION_AUTHORITY'},
            governance:{activeChampionReference:x.governance.activeChampion,nativeSelectsV20Opportunities:true,v17ControlsExecution:true,automaticPromotion:false,automaticBrokerOrders:false},
            isolation:{mainAppRead:false,mainAppWrite:false,v17SourceWrite:false,v20SourceWrite:false,deploymentPublishAllowlist:['data/v20/**','v20/deployment.json']},
            gates:{v17ExecutionGrade:gate.executionGrade===true,v17SessionAligned:gate.sessionAligned===true,nativeRegressionPassed:true,researchOverlayExecutionLeak:false,portfolioGuardPassed:risk.invariants?.closedGateMeansZeroAppliedExposure===true}
          });
          console.log(JSON.stringify({sessionDate:x.sessionDate,selectionEngine:x.selectionEngine.engineId,executionStatus:x.executionStatus,actionable:actionable.length,exposurePct:exposure,cashPct:x.portfolio.cashPct,nativeResearchCoveragePct:overlay.researchReferenceCoveragePct},null,2));
          NODE

      - name: Publish V20 only and prove MAIN APP isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f "$V20_DIR/data/v20/current.json"
          test -f "$V20_DIR/data/v20/executive-runtime.json"
          test -f "$V20_DIR/data/v20/full-market-native-selection.json"
          test -f "$V20_DIR/data/v20/native-research-session-overlay.json"
          test -f "$V20_DIR/data/v20/native-vs-main-comparison.json"
          test -f "$V20_DIR/data/v20/native-executive-current-regression.json"

          mkdir -p data/v20
          cp -a "$V20_DIR/data/v20/." data/v20/

          V20_SOURCE_SHA="$(git -C "$V20_DIR" rev-parse HEAD)"
          node - "$V20_SOURCE_SHA" <<'NODE'
          const fs=require('fs');
          const sourceCommit=process.argv[2];
          const p='v20/deployment.json';
          let d={}; try{d=JSON.parse(fs.readFileSync(p,'utf8'))}catch{}
          const x=JSON.parse(fs.readFileSync('data/v20/current.json','utf8'));
          const overlay=JSON.parse(fs.readFileSync('data/v20/native-research-session-overlay.json','utf8'));
          d={...d,publishedAt:new Date().toISOString(),sourceRepository:'rasheadsca-star/RAS-EGX-PRO2026-NEXT',sourceBranch:'develop/v20-integrated-decision-platform',sourceCommit,v17SourceCommit:process.env.V17_RUNTIME_SHA,sessionDate:x.sessionDate,executionStatus:x.executionStatus,operatingMode:'EXECUTIVE_FAIL_CLOSED',selectionEngine:x.selectionEngine?.engineId||null,selectionMode:x.selectionEngine?.mode||null,fullMarketNativeSelection:x.selectionEngine?.candidateUniverseIsFullMarketIndependent===true,legacySeedDependency:x.selectionEngine?.legacySeedDependency??null,nativeResearchSessionReference:true,nativeResearchSessionCoveragePct:overlay.researchReferenceCoveragePct,automaticBrokerOrders:false,automaticPromotion:false,mainAppMutation:false,publisher:'v20-executive-engine.yml'};
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE

          changed="$(git status --porcelain | sed -E 's/^.. //')"
          violations="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(data/v20/|v20/deployment\.json$)' || true)"
          test -z "$violations" || { echo 'MAIN APP isolation violation:'; echo "$violations"; exit 1; }

          git add data/v20 v20/deployment.json
          staged="$(git diff --cached --name-only)"
          staged_violations="$(printf '%s\n' "$staged" | grep -Ev '^(data/v20/|v20/deployment\.json$)' || true)"
          test -z "$staged_violations" || { echo 'Forbidden staged paths:'; echo "$staged_violations"; exit 1; }

          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/v20/current.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/v20/executive-runtime.json','utf8'));
          if(r.isolation?.mainAppWrite!==false) throw new Error('MAIN APP write isolation not asserted');
          if(x.operatingMode!=='EXECUTIVE_FAIL_CLOSED') throw new Error('V20 executive mode missing');
          if(x.selectionEngine?.mode!=='V20_NATIVE_FULL_MARKET_PRIMARY_SELECTION') throw new Error('Native primary selection missing at publish boundary');
          if(x.selectionEngine?.legacySeedDependency!==false) throw new Error('Legacy seed dependency returned');
          if(r.nativeResearchSessionReference?.executionInfluence!==false) throw new Error('Research session reference gained execution influence');
          console.log(JSON.stringify({publishReady:true,sessionDate:x.sessionDate,selectionEngine:x.selectionEngine.engineId,executionStatus:x.executionStatus,operatingMode:x.operatingMode},null,2));
          NODE

          if git diff --cached --quiet; then
            echo 'No V20 executive data changes to publish.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V20 native executive: publish full-market decision cycle'
          git pull --rebase origin main
          git push origin HEAD:main

name: V20 Executive Engine

on:
  workflow_dispatch:
  schedule:
    # 17:20 Africa/Cairo (UTC+3) after the EGX close, Sunday-Thursday.
    - cron: '20 14 * * 0-4'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v20-executive-engine.yml'

permissions:
  contents: write

concurrency:
  group: v20-executive-engine
  cancel-in-progress: true

jobs:
  rebuild-v20-executive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EGX_MUBASHER_CONCURRENCY: '4'
      EGX_MUBASHER_TIMEOUT_MS: '25000'
      EGX_SR_CONCURRENCY: '8'
      EGX_SR_TIMEOUT_MS: '25000'
      EGX_SR_MIN_ROWS: '80'
      EGX_INTERNAL_SR_MIN_COVERAGE: '95'
      EGX_INTERNAL_SR_MIN_FRESHNESS: '98'
      EGX_INTERNAL_SR_MIN_CONFIDENCE: '0.80'
      V20_SOURCE_BRANCH: develop/v20-integrated-decision-platform
      V17_SOURCE_BRANCH: develop/v17-rebuild

    steps:
      - name: Checkout deployment repository only
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Record protected MAIN APP baseline
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          git status --porcelain
          echo "MAIN_APP_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "The executive cycle may publish only data/v20/** and v20/deployment.json."

      - name: Build fresh V17 evidence in an isolated temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          V17_DIR="$RUNNER_TEMP/v17-executive-runtime"
          rm -rf "$V17_DIR"
          git clone --quiet --depth=1 --branch "$V17_SOURCE_BRANCH" \
            https://github.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT.git "$V17_DIR"
          cd "$V17_DIR"

          npm ci || npm install

          success=0
          for attempt in 1 2 3; do
            if node scripts/fetch-market-data.js; then success=1; break; fi
            echo "::warning::Market collector attempt ${attempt} failed"
            sleep 10
          done
          test "$success" = "1" || { echo "Fresh market collection failed"; exit 1; }

          node scripts/stable/v16-mubasher-session-evidence-enricher.cjs

          npm install --no-save --no-package-lock cheerio@1.0.0
          node scripts/collect-mubasher-direct-stock-sr.js || \
            echo "::warning::Direct Mubasher S/R validation unavailable; fail-closed gates will decide."

          node scripts/v17/market-session-truth.cjs
          node scripts/v17/repair-session-history.cjs

          for s in \
            scripts/build-price-source-audit.js \
            scripts/build-price-freshness-report.js \
            scripts/build-workflow-source-verification.js \
            scripts/build-session-memory-status.js \
            scripts/build-symbol-audit.js; do
            [ ! -f "$s" ] || node "$s" || true
          done

          node scripts/v17/build-internal-ohlc-sr.cjs
          node scripts/v17/build-liquidity-gate.cjs
          node scripts/v17/resilient-session-gate.cjs

          for s in \
            scripts/build-v52-intelligence.js \
            scripts/build-v54-universe-index.js \
            scripts/build-v55-sector-investor-flow.js \
            scripts/build-v56-history-50.js \
            scripts/build-v56-technical-report.js \
            scripts/collect-egx-investor-type.js \
            scripts/collect-v56-news.js \
            scripts/build-multi-source-intelligence.js \
            scripts/apply-multisource-intelligence-to-ranking.js \
            scripts/build-institutional-score.js \
            scripts/build-signal-quality-engine.js \
            scripts/build-entry-trigger-engine.js \
            scripts/build-alert-decision-center.js \
            scripts/build-actionable-watchlist.js \
            scripts/build-data-operations-center.js \
            scripts/build-engines-console-report.js \
            scripts/build-executive-home-report.js \
            scripts/build-workflow-budget-status.js \
            scripts/build-sector-completion-report.js \
            scripts/build-recommendation-outcome-tracker.js \
            scripts/build-recommendation-accuracy.js \
            scripts/build-recommendation-performance-index.js \
            scripts/build-accuracy-interpretation-report.js \
            scripts/build-recommendation-validation-panel.js \
            scripts/build-portfolio-decision-rules.js \
            scripts/build-rebalancing-candidates.js; do
            [ ! -f "$s" ] || node "$s" || echo "::warning::$s failed"
          done

          node scripts/v17/rebuild-current-recommendation-base.cjs
          node scripts/v17/build-pre-session-intelligence.cjs
          node scripts/apply-news-impact-to-recommendations.js
          node scripts/v17/repair-session-history.cjs

          [ ! -f scripts/build-history-50-engine.js ] || node scripts/build-history-50-engine.js
          [ ! -f scripts/build-price-reconciliation-report.js ] || node scripts/build-price-reconciliation-report.js
          node scripts/build-final-opportunity-ranking.js
          [ ! -f scripts/build-confidence-guard-report.js ] || node scripts/build-confidence-guard-report.js
          [ ! -f scripts/build-daily-decision-brief.js ] || node scripts/build-daily-decision-brief.js

          node scripts/v17/build-internal-ohlc-sr.cjs
          node scripts/v17/audit-sr-history-gaps.cjs
          node scripts/v17/build-liquidity-gate.cjs
          node scripts/v17/resilient-session-gate.cjs
          node scripts/build-goal-integrated-decision.js
          node scripts/v17/challenger-gate.cjs

          node scripts/v17/build-snapshot.cjs
          node scripts/v17/resolve-ledger.cjs
          node scripts/v17/build-snapshot.cjs
          node scripts/v17/enrich-snapshot.cjs
          node scripts/v17/finalize-snapshot.cjs
          node scripts/v17/snapshot-provenance-guard.cjs

          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const current=read('data/v17/current.json');
          const gate=read('data/v17/resilient-session-status.json');
          const truth=read('data/v17/market-session-truth.json');
          const liquidity=read('data/v17/liquidity-gate.json');
          const challenger=read('data/v17/challenger-status.json');
          const rec=read('data/recommendations.json');
          const technical=read('data/technical-50-report.json');
          const session=truth.selectedSessionDate;
          if(!/^\d{4}-\d{2}-\d{2}$/.test(String(session||''))) throw new Error('No verified V17 session');
          if(current.sessionDate!==session) throw new Error('V17 current/session mismatch');
          if((gate.priceTruth?.verifiedSessionDate||gate.sessionDate)!==session) throw new Error('V17 gate/session mismatch');
          if(rec.sessionDate!==session||rec.engine!=='V17_CURRENT_SESSION_TECHNICAL_BASE_1') throw new Error('V17 recommendation base is not current-session canonical');
          if(technical.referenceSessionDate!==session||technical.version!=='5.6.1-v17-session-truth') throw new Error('V17 Technical-50 is not current-session canonical');
          if(challenger.activeEngine!=='V16_9_EQUAL_WEIGHT_BASKET'||challenger.promotionAllowed!==false) throw new Error('V17 champion governance drift');
          if(!['HEALTHY','DEGRADED','RESEARCH_ONLY'].includes(gate.status)) throw new Error(`Unacceptable V17 gate: ${gate.status}`);
          if(gate.executionGrade===true && (gate.sessionAligned!==true||liquidity.gatePassed!==true||truth.executionSafe!==true)) throw new Error('Execution grade without all global gates');
          if(gate.executionGrade!==true){
            if(Number(current.portfolioPolicy?.plannedAllocationPct||0)!==0||Number(current.portfolioPolicy?.cashReservePct||0)!==100) throw new Error('Closed V17 gate carries exposure');
            if((current.recommendations||[]).some(r=>r.executionAllowed===true)) throw new Error('Closed V17 gate carries executable recommendation');
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/v17-executive-summary.json',JSON.stringify({
            generatedAt:new Date().toISOString(),sessionDate:session,gateStatus:gate.status,
            executionGrade:gate.executionGrade===true,sessionAligned:gate.sessionAligned===true,
            liquidityGatePassed:liquidity.gatePassed===true,champion:challenger.activeEngine,
            sourceBranch:process.env.V17_SOURCE_BRANCH,automaticPromotion:false
          },null,2)+'\n');
          console.log(JSON.stringify({session,gate:gate.status,executionGrade:gate.executionGrade===true,liquidity:liquidity.gatePassed===true},null,2));
          NODE

      - name: Build V20 executive decision layer in a separate temporary workspace
        shell: bash
        env:
          V20_REGIME_NETWORK_REFRESH: 'true'
          V20_REGIME_CONCURRENCY: '6'
          V20_REGIME_MIN_PARTICIPATION_PCT: '60'
          V20_REGIME_PRICE_TOLERANCE_PCT: '5'
          V20_REGIME_MIN_TRUSTED_SESSIONS: '50'
          V20_REGIME_FETCH_RANGE: '6mo'
          V20_HISTORY_NETWORK_REFRESH: 'true'
          V20_HISTORY_CONCURRENCY: '4'
          V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT: '5'
        run: |
          set -euo pipefail
          V17_DIR="$RUNNER_TEMP/v17-executive-runtime"
          V20_DIR="$RUNNER_TEMP/v20-executive-runtime"
          rm -rf "$V20_DIR"
          git clone --quiet --depth=1 --branch "$V20_SOURCE_BRANCH" \
            https://github.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT.git "$V20_DIR"
          cd "$V20_DIR"
          npm ci || npm install

          # Materialize fresh V17 evidence only inside this disposable V20 workspace.
          mkdir -p data/v17
          cp -a "$V17_DIR/data/v17/." data/v17/
          find "$V17_DIR/data" -maxdepth 1 -type f -name '*.json' -exec cp -f {} data/ \;

          cat "$RUNNER_TEMP/v17-executive-summary.json"

          node --check scripts/v20/build-data-truth.cjs
          node --check scripts/v20/build-market-regime.cjs
          node --check scripts/v20/build-integrated-decision-snapshot.cjs
          node --check scripts/v20/enrich-risk-reward.cjs
          node --check scripts/v20/validate-trade-plans.cjs
          node --check scripts/v20/build-portfolio-risk.cjs

          node scripts/v20/build-data-truth.cjs
          node scripts/v20/data-quality-regression.cjs
          node scripts/v20/build-sector-provenance-audit.cjs
          node scripts/v20/build-market-regime.cjs
          node scripts/v20/market-regime-regression.cjs
          node scripts/v20/build-integrated-decision-snapshot.cjs
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs
          node scripts/v20/build-trusted-technical-history.cjs
          node scripts/v20/technical-history-regression.cjs
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs
          node scripts/v20/user-portfolio-regression.cjs
          node scripts/v20/archive-signal.cjs

          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const x=read('data/v20/current.json');
          const gate=read('data/v17/resilient-session-status.json');
          const truth=read('data/v17/market-session-truth.json');
          const risk=read('data/v20/portfolio-risk.json');
          const session=truth.selectedSessionDate;
          if(x.sessionDate!==session) throw new Error(`V20/V17 session mismatch ${x.sessionDate} != ${session}`);
          if(x.governance?.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET') throw new Error('V20 champion drift');
          if(x.governance?.automaticPromotion!==false||x.governance?.promotionAllowed!==false) throw new Error('Automatic promotion is forbidden');
          if(x.portfolio?.automaticOrders!==false) throw new Error('Automatic broker orders are forbidden');
          if(gate.executionGrade!==true){
            if(x.executionStatus==='EXECUTION_GRADE') throw new Error('V20 claims execution grade while V17 gate is closed');
            if(Number(x.portfolio?.recommendedExposurePct||0)!==0||Number(x.portfolio?.cashPct||0)!==100) throw new Error('Closed gate must remain 100% cash');
            if((x.opportunities||[]).some(r=>r.status==='ACTIONABLE')) throw new Error('Closed gate produced actionable rows');
          }
          if(x.executionStatus==='EXECUTION_GRADE'){
            for(const row of (x.opportunities||[]).filter(r=>r.status==='ACTIONABLE')){
              if(row.liquidityExecutionEligible!==true) throw new Error(`${row.ticker}: liquidity gate missing`);
              if(row.supportResistance?.executionEligible!==true||row.supportResistance?.sessionAligned!==true) throw new Error(`${row.ticker}: S/R gate missing`);
              if(row.tradePlan?.alignment?.eligibleForActionable!==true||row.tradePlan?.alignment?.state!=='IN_ENTRY_RANGE') throw new Error(`${row.ticker}: entry alignment missing`);
              if(row.tradePlan?.target1Metrics?.valid!==true) throw new Error(`${row.ticker}: invalid risk/reward plan`);
            }
          }
          const max=Number(x.portfolio?.maximumTotalAllocationPct||0);
          const exposure=Number(x.portfolio?.recommendedExposurePct||0);
          if(exposure<0||exposure>max+1e-9) throw new Error('Portfolio exposure guard failed');

          x.operatingMode='EXECUTIVE_FAIL_CLOSED';
          x.executionPolicy={
            mode:'MANUAL_DECISION_EXECUTION',
            automaticBrokerOrders:false,
            v17GlobalGateAuthoritative:true,
            currentSessionRequired:true,
            liquidityRequired:true,
            supportResistanceRequired:true,
            tradePlanAlignmentRequired:true,
            positiveRiskRewardRequired:true,
            failedGateKeepsCash:true
          };
          write('data/v20/current.json',x);
          write('data/v20/executive-runtime.json',{
            schemaVersion:'20.0.0-executive-runtime-1',generatedAt:new Date().toISOString(),
            operatingMode:'EXECUTIVE_FAIL_CLOSED',sessionDate:x.sessionDate,status:x.status,
            executionStatus:x.executionStatus,actionableCount:(x.opportunities||[]).filter(r=>r.status==='ACTIONABLE').length,
            recommendedExposurePct:exposure,cashPct:Number(x.portfolio?.cashPct||0),
            source:{v17Branch:process.env.V17_SOURCE_BRANCH,v20Branch:process.env.V20_SOURCE_BRANCH,buildMode:'ISOLATED_TEMPORARY_WORKSPACES'},
            governance:{activeChampion:x.governance.activeChampion,automaticPromotion:false,automaticBrokerOrders:false},
            isolation:{mainAppRead:false,mainAppWrite:false,v17SourceWrite:false,v20SourceWrite:false,deploymentPublishAllowlist:['data/v20/**','v20/deployment.json']},
            gates:{v17ExecutionGrade:gate.executionGrade===true,v17SessionAligned:gate.sessionAligned===true,portfolioGuardPassed:risk.invariants?.closedGateMeansZeroAppliedExposure===true}
          });
          console.log(JSON.stringify({sessionDate:x.sessionDate,executionStatus:x.executionStatus,actionable:(x.opportunities||[]).filter(r=>r.status==='ACTIONABLE').length,exposurePct:exposure,cashPct:x.portfolio.cashPct},null,2));
          NODE

      - name: Publish V20 outputs only and prove MAIN APP isolation
        shell: bash
        run: |
          set -euo pipefail
          V20_DIR="$RUNNER_TEMP/v20-executive-runtime"
          test -f "$V20_DIR/data/v20/current.json"
          test -f "$V20_DIR/data/v20/executive-runtime.json"

          mkdir -p data/v20
          cp -a "$V20_DIR/data/v20/." data/v20/

          SOURCE_SHA="$(git -C "$V20_DIR" rev-parse HEAD)"
          node - "$SOURCE_SHA" <<'NODE'
          const fs=require('fs');
          const sourceCommit=process.argv[2];
          const p='v20/deployment.json';
          let d={}; try{d=JSON.parse(fs.readFileSync(p,'utf8'))}catch{}
          const x=JSON.parse(fs.readFileSync('data/v20/current.json','utf8'));
          d={...d,
            publishedAt:new Date().toISOString(),sourceRepository:'rasheadsca-star/RAS-EGX-PRO2026-NEXT',
            sourceBranch:'develop/v20-integrated-decision-platform',sourceCommit,
            sessionDate:x.sessionDate,executionStatus:x.executionStatus,operatingMode:'EXECUTIVE_FAIL_CLOSED',
            automaticBrokerOrders:false,automaticPromotion:false,mainAppMutation:false,
            publisher:'v20-executive-engine.yml'
          };
          fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE

          changed="$(git status --porcelain | sed -E 's/^.. //')"
          violations="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(data/v20/|v20/deployment\.json$)' || true)"
          test -z "$violations" || { echo 'MAIN APP isolation violation:'; echo "$violations"; exit 1; }

          git add data/v20 v20/deployment.json
          staged="$(git diff --cached --name-only)"
          staged_violations="$(printf '%s\n' "$staged" | grep -Ev '^(data/v20/|v20/deployment\.json$)' || true)"
          test -z "$staged_violations" || { echo 'Forbidden staged paths:'; echo "$staged_violations"; exit 1; }

          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/v20/current.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/v20/executive-runtime.json','utf8'));
          if(r.isolation?.mainAppWrite!==false) throw new Error('MAIN APP write isolation not asserted');
          if(x.operatingMode!=='EXECUTIVE_FAIL_CLOSED') throw new Error('V20 executive mode missing');
          console.log(JSON.stringify({publishReady:true,sessionDate:x.sessionDate,executionStatus:x.executionStatus,operatingMode:x.operatingMode},null,2));
          NODE

          if git diff --cached --quiet; then
            echo 'No V20 executive data changes to publish.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V20 executive: publish current fail-closed decision cycle'
          git pull --rebase origin main
          git push origin HEAD:main
